name: Deploy

# Uploads the committed release build (site/) to https://casual.spence.dk/ over SFTP (or FTPS).
# Runs when a merge to main changes site/, or by hand from the Actions tab.
# Images hosted on the server (assets/sprites, assets/thumbs, assets/runtime, assets/boxart)
# are never touched, and nothing outside site/'s own generated files is deleted.

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list what would be uploaded and deleted'
        type: boolean
        default: false

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Secrets live in the "production" environment (Settings → Environments), where a
    # required reviewer can also be set so every deployment waits for approval.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check the release build
        run: |
          test -f site/index.html || { echo "site/index.html is missing: run npm run release and commit site/"; exit 1; }
          ls -la site site/assets

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Trust the server's host key
        if: ${{ (vars.DEPLOY_PROTOCOL || 'sftp') == 'sftp' }}
        env:
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: |
          test -n "$SFTP_KNOWN_HOSTS" || { echo "Secret SFTP_KNOWN_HOSTS is not set (see README, Deploying)."; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload site/
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
          PROTOCOL: ${{ vars.DEPLOY_PROTOCOL || 'sftp' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          for v in SFTP_HOST SFTP_USER LFTP_PASSWORD SFTP_PATH; do
            test -n "${!v}" || { echo "Secret for $v is not set (see README, Deploying)."; exit 1; }
          done
          case "$PROTOCOL" in
            sftp) PORT=${SFTP_PORT:-22}; SETTINGS="" ;;
            # FTP over TLS (IIS's built-in FTP server): explicit TLS, certificate checked.
            ftps) PROTOCOL=ftp; PORT=${SFTP_PORT:-21}; SETTINGS="set ftp:ssl-force true; set ftp:ssl-protect-data true;" ;;
            *) echo "DEPLOY_PROTOCOL must be sftp or ftps"; exit 1 ;;
          esac
          OPEN="$SETTINGS open --env-password -u \"$SFTP_USER\" -p $PORT $PROTOCOL://$SFTP_HOST"
          scripts/deploy-sftp.sh "$OPEN" "$SFTP_PATH" $DRY_RUN
